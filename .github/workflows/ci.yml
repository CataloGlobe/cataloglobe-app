name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Su PR e push: dalla #381 eslint ha 0 errori, una PR che ne porta di
    # nuovi diventa rossa. Gli avvisi non fermano.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  ds-budget:
    name: Design system budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Nessuna dipendenza: lo script usa solo node:fs e node:path.
      - run: npm run ds:budget:check
      # e2e/ non sta in nessun tsconfig del build (tsc -b): un errore di tipo
      # in un test non ferma Vercel, lo ferma questo passo.
      - run: npm ci
      - run: npm run typecheck:e2e
