<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- Landing di campagna (/ e /b). ⚠️ SYNC con index.html: stesso head, tranne preconnect a Supabase e app-inter.css
         (Inter lo carica entry-landing.tsx senza bloccare il render), più il preload dei font dell'hero. Lo verifica src/tests/landing/landingHtml.test.ts.
         Al build diventa dist/index.html (/) e dist/b.html (/b), con la pagina già renderizzata al posto di landing-ssr;
         la shell dell'app diventa dist/app.html (scripts/prerender-landing.mjs). -->
    <link rel="icon" type="image/svg+xml" href="/favicon/cataloglobe_icon_flat_primary.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/cataloglobe_icon_flat_primary_32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/cataloglobe_icon_flat_primary_16.png" />

    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/cataloglobe_icon_flat_primary_180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6B2DE6" />

    <!-- Font dell'hero (titolo e testo), gli stessi di public/fonts/app-campaign.css: partono con l'HTML. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      "@type": "Organization",
      "name": "CataloGlobe",
      "legalName": "CataloGlobe di D'Elia Alessandro",
      "url": "https://cataloglobe.com",
      "description": "Menù digitale con QR per ristoranti e bar, che si aggiorna da solo.",

        "@type": "PostalAddress",
        "streetAddress": "Via Verdi, 30",
        "postalCode": "20092",
        "addressLocality": "Cinisello Balsamo",
        "addressRegion": "MI",
        "addressCountry": "IT"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "support@cataloglobe.com",
        "availableLanguage": ["Italian"]
      }
    }
    </script>
