<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Form — primo passo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Instrument Sans', sans-serif;background:#FBF9F5}
a{color:#4648C6}a:hover{color:#33359E}
summary::-webkit-details-marker{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEEDFB; color: #1A1613; display: flex; flex-direction: column;">
  <div style="padding: 30px 20px;">
    <h2 style="margin: 0; font-family: 'Young Serif', serif; font-size: 30px; line-height: 1.12; font-weight: 400; color: #1A1613;">Ti richiamiamo noi.</h2>
    <p style="margin: 14px 0 0; font-size: 16px; line-height: 1.55; color: #3E3830;">Quattro campi. Il resto ce lo diciamo al telefono.</p>
    <form style="margin-top: 22px; display: flex; flex-direction: column; gap: 13px;">
    <label style="display: block; font-size: 14px; font-weight: 600;">Nome
      <input type="text" name="nome" autocomplete="given-name" value="Marco" style="display: block; width: 100%; box-sizing: border-box; margin-top: 6px; min-height: 50px; padding: 13px 15px; border: 1px solid #E7E2D9; border-radius: 12px; background: #FFFFFF; font-family: 'Instrument Sans', sans-serif; font-size: 16px; color: #1A1613;">
    </label>
    <label style="display: block; font-size: 14px; font-weight: 600;">Nome del locale
      <input type="text" name="locale" autocomplete="organization" value="Trattoria del Ponte" style="display: block; width: 100%; box-sizing: border-box; margin-top: 6px; min-height: 50px; padding: 13px 15px; border: 1px solid #E7E2D9; border-radius: 12px; background: #FFFFFF; font-family: 'Instrument Sans', sans-serif; font-size: 16px; color: #1A1613;">
    </label>
    <label style="display: block; font-size: 14px; font-weight: 600;">Telefono
      <input type="tel" name="telefono" autocomplete="tel" value="333 000 0000" style="display: block; width: 100%; box-sizing: border-box; margin-top: 6px; min-height: 50px; padding: 13px 15px; border: 2px solid #4648C6; border-radius: 12px; background: #FFFFFF; font-family: 'Instrument Sans', sans-serif; font-size: 16px; color: #1A1613;">
    </label>
    <label style="display: block; font-size: 14px; font-weight: 600;">Email
      <input type="email" name="email" autocomplete="email" placeholder="marco@trattoriadelponte.it" style="display: block; width: 100%; box-sizing: border-box; margin-top: 6px; min-height: 50px; padding: 13px 15px; border: 1px solid #E7E2D9; border-radius: 12px; background: #FFFFFF; font-family: 'Instrument Sans', sans-serif; font-size: 16px; color: #6A6158;">
    </label>
      <fieldset style="margin: 4px 0 0; padding: 0; border: 0;">
        <legend style="padding: 0; font-size: 14px; font-weight: 600;">Cosa ti interessa di più?</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"><button type="button" style="min-height: 44px; padding: 10px 16px; border: 1px solid #4648C6; border-radius: 999px; background: #4648C6; font-family: 'Instrument Sans', sans-serif; font-size: 14px; font-weight: 600; color: #FFFFFF;">Il menù</button><button type="button" style="min-height: 44px; padding: 10px 16px; border: 1px solid #E7E2D9; border-radius: 999px; background: #FFFFFF; font-family: 'Instrument Sans', sans-serif; font-size: 14px; font-weight: 500; color: #1A1613;">Le prenotazioni</button><button type="button" style="min-height: 44px; padding: 10px 16px; border: 1px solid #E7E2D9; border-radius: 999px; background: #FFFFFF; font-family: 'Instrument Sans', sans-serif; font-size: 14px; font-weight: 500; color: #1A1613;">Gli ordini al tavolo</button></div>
      </fieldset>
      <label style="display: flex; gap: 10px; align-items: flex-start; margin-top: 4px; font-size: 13px; line-height: 1.45; color: #3E3830; font-weight: 400;">
        <input type="checkbox" name="privacy" style="width: 20px; height: 20px; flex-shrink: 0; margin: 1px 0 0; accent-color: #4648C6;">
        <span>Ho letto l’<a href="/legal/privacy">informativa privacy</a> e acconsento al trattamento dei dati per essere ricontattato.</span>
      </label>
      <button type="submit" style="margin-top: 6px; min-height: 56px; padding: 17px; border: 0; border-radius: 14px; background: #4648C6; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif; font-size: 17px; font-weight: 600;">Fatti richiamare</button>
    </form>
    <p style="margin: 12px 0 0; font-size: 12px; line-height: 1.55; color: #6A6158;">Ti chiamiamo entro 24 ore. Se preferisci scrivere: info@cataloglobe.com</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}

</script>
</body>
</html>
